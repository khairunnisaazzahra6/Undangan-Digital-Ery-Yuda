<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinRa Generator Undangan - Ery & Joko</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --dark-wood: #221a10;
            --cream-bg: #f7f4ee;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--dark-wood);
            background-image: radial-gradient(circle at center, #352a1a 0%, #15100a 100%);
            color: #333;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .generator-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 2px dashed var(--gold);
            position: relative;
            box-sizing: border-box;
            text-align: center;
        }

        .subtitle-top {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #8c733f;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .couple-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--dark-wood);
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }

        .desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--dark-wood);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #d8ccb8;
            background: #faf8f5;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--gold);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .btn-generate {
            background-color: var(--dark-wood);
            color: var(--gold);
            border: 1px solid var(--gold);
            width: 100%;
            padding: 0.9rem;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(34,26,16,0.2);
        }

        .btn-generate:hover {
            background-color: #352a1a;
            transform: translateY(-1px);
        }

        .result-box {
            background: #fbf9f4;
            border: 1px solid #e6dcc8;
            padding: 1.25rem;
            border-radius: 10px;
            margin-top: 1.5rem;
            text-align: left;
            display: none;
        }

        .result-box.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #8c733f;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .link-output {
            background: #fff;
            border: 1px solid #d8ccb8;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #444;
            word-break: break-all;
            margin-bottom: 1rem;
        }

        .btn-copy {
            background: linear-gradient(135deg, #d4af37 0%, #b89728 100%);
            color: #fff;
            border: none;
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-copy:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="generator-card">
        <div class="subtitle-top">Dashboard Pengantin</div>
        <h1 class="couple-title">Ery & Joko</h1>
        <p class="desc">Buat dan salin tautan undangan tamu khusus di sini</p>

        <div class="input-group">
            <label for="guestName">Nama Tamu Undangan</label>
            <input type="text" id="guestName" placeholder="Contoh: Bpk. Budi & Keluarga">
        </div>

        <button class="btn-generate" onclick="generateLink()">
            Buat Link Undangan
        </button>

        <div class="result-box" id="resultBox">
            <div class="result-title">
                <i class="fa-solid fa-sparkles" style="color: var(--gold);"></i> 
                <span id="successInfo">Link Undangan Berhasil Dibuat!</span>
            </div>
            <div class="link-output" id="linkText"></div>
            
            <button class="btn-copy" onclick="copyLink()">
                <i class="fa-regular fa-copy"></i> Salin Link Undangan
            </button>
        </div>
    </div>

    <script>
        function generateLink() {
            const nameInput = document.getElementById('guestName').value.trim();
            if (!nameInput) {
                alert('Silakan masukkan nama tamu terlebih dahulu, sayang!');
                return;
            }

            // Ambil root domain/folder utama sebelum file admin.html
            const currentPath = window.location.pathname;
            const parentPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
            const baseUrl = window.location.origin + parentPath + '/';
            
            // Arahkan langsung ke index.html utama
            const targetUrl = baseUrl + 'index.html?to=' + encodeURIComponent(nameInput);

            document.getElementById('successInfo').innerText = `Link Undangan Berhasil Dibuat!`;
            document.getElementById('linkText').innerText = targetUrl;
            document.getElementById('resultBox').classList.add('active');
        }

        function copyLink() {
            const linkText = document.getElementById('linkText').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert('Link berhasil disalin! Silakan bagikan ke tamu, sayang.');
            }).catch(err => {
                console.error('Gagal menyalin:', err);
            });
        }
    </script>
</body>
</html>
