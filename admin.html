<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinRa Generator Undangan - Ery & Yuda</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --dark-wood: #18120b;
            --card-bg: #221a10;
            --cream-text: #f7f4ee;
        }

        body {
            background-color: var(--dark-wood);
            background-image: radial-gradient(circle at center, #2c2115 0%, #110c07 100%);
            color: var(--cream-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Aksen Motif Batik Tipis di Background */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .generator-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(212, 175, 55, 0.3);
            border: 2px solid var(--gold);
            position: relative;
            box-sizing: border-box;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        /* Ornamen Aksen Sudut Klasik */
        .generator-card::before, .generator-card::after {
            content: "❖";
            position: absolute;
            color: var(--gold);
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .generator-card::before { top: 12px; left: 16px; }
        .generator-card::after { top: 12px; right: 16px; }

        .subtitle-top {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--gold-light);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .couple-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold);
            margin: 0 0 0.5rem 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(212,175,55,0.2);
        }

        .desc {
            font-size: 0.85rem;
            color: #d1c7bd;
            margin-bottom: 2.5rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.95rem 1.1rem;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: #140f09;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--gold);
            background: #1c150e;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
        }

        .btn-generate {
            background: linear-gradient(135deg, #d4af37 0%, #aa8225 100%);
            color: #18120b;
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
            margin-top: 0.5rem;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            background: linear-gradient(135deg, #e6c152, #bd912c);
        }

        .result-box {
            background: #140f09;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 1.25rem;
            border-radius: 12px;
            margin-top: 1.75rem;
            text-align: left;
            display: none;
        }

        .result-box.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .link-output {
            background: #0a0704;
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #e2d8cc;
            word-break: break-all;
            margin-bottom: 1rem;
        }

        .btn-copy {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-copy:hover {
            background: var(--gold);
            color: #18120b;
        }
    </style>
</head>
<body>

    <div class="generator-card">
        <div class="subtitle-top">— Dashboard MinRa Digital Invitation —</div>
        <h1 class="couple-title">Ery & Yuda</h1>
        <p class="desc">Dashboard Pembuatan Tautan Undangan untuk Tamu</p>

        <div class="input-group">
            <label for="guestName">Nama Tamu Undangan</label>
            <input type="text" id="guestName" placeholder="Contoh: Rara & Partner">
        </div>

        <button class="btn-generate" onclick="generateLink()">
            <i class="fa-solid fa-feather-pointed"></i> Buat Link Undangan
        </button>

        <div class="result-box" id="resultBox">
            <div class="result-title">
                <i class="fa-solid fa-sparkles"></i> 
                <span>Tautan Berhasil Digenerate</span>
            </div>
            <div class="link-output" id="linkText"></div>
            
            <button class="btn-copy" onclick="copyLink()">
                <i class="fa-regular fa-copy"></i> Salin Tautan Undangan
            </button>
        </div>
    </div>

    <script>
        function generateLink() {
            const nameInput = document.getElementById('guestName').value.trim();
            if (!nameInput) {
                alert('Silakan masukkan nama tamu terlebih dahulu, sayang!');
                return;
            }

            const rootDomain = window.location.origin;
            const targetUrl = rootDomain + '/index.html?to=' + encodeURIComponent(nameInput);

            const linkTextEl = document.getElementById('linkText');
            if (linkTextEl) {
                linkTextEl.innerText = targetUrl;
            }
            
            const resultBox = document.getElementById('resultBox');
            if (resultBox) {
                resultBox.classList.add('active');
            }
        }

        function copyLink() {
            const linkText = document.getElementById('linkText').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert('Tautan berhasil disalin! Silakan bagikan ke tamu, sayang.');
            }).catch(err => {
                console.error('Gagal menyalin:', err);
            });
        }
    </script>

</body>
</html>
